# Déploiement en un clic sur Render (https://render.com) : New > Blueprint > choisir ce dépôt.
services:
  - type: web
    name: estimeo
    runtime: node
    plan: free
    # --include=dev : le build a besoin de Vite, TypeScript et esbuild
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CAL_API_KEY
        sync: false
      - key: CAL_EVENT_TYPE_ID
        sync: false
      - key: CAL_WEBHOOK_SECRET
        sync: false
      - key: AGENT_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: MAIL_FROM_NAME
        value: Céline Levrat
      - key: MAIL_REPLY_TO
        sync: false
      - key: APP_URL
        sync: false
